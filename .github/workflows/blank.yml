# This is a basic workflow to help you get started with Actions

name: test_wf

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
   inputs:
    name: "greet"
    description: "person to greet"
    # default value provided, if no value exist
    default: "world"
    required: true
    type: string
		
    city: 
    description: "where a person live"
    default: "newyork"
    required: true
    type: choice
    options:
     -washington
     -texas
    favcolour:
    description:
    default: 0
    required: true
    type: boolean
    
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "greet" mentioned above
  greet: 
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: send greeting

      # Runs a single command using the runners shell
      
        run: |
         echo "Hello ${{ github.event.inputs.name }}"
         echo "where do thye live ${{github.event.inputs.city}}"
         echo "color they like ${{github.event.inputs.favcolour}}"

      
	 
