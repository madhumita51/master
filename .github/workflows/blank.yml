name: test_wf

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

  workflow_dispatch:
    inputs:
      name:
        description: "person to greet"
        default: "world"
        required: true
        type: string

      city:
        description: "where a person lives"
        default: "newyork"
        required: true
        type: choice
        options:
          - washington
          - texas

      favcolour:
        description: "favourite colour?"
        default: false
        required: true
        type: boolean

jobs:
  greet:
    runs-on: ubuntu-latest

    steps:
      - name: send greeting
        run: |
          echo "Hello ${{ github.event.inputs.name }}"
          echo "where do they live ${{ github.event.inputs.city }}"
          echo "colour they like ${{ github.event.inputs.favcolour }}"
